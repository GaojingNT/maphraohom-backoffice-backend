      summary: Get customer
      tags:
      - Customer Module (Version 1)
  /api/v1/customers/{id}/addresses:
    get:
      consumes:
      - application/json
      description: Get every address on file for this customer
      parameters:
      - description: customer id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/responses.CustomerAddressItem'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: List a customer's addresses
      tags:
      - Customer Module (Version 1)
  /api/v1/files/{path}:
    get:
      description: |-
        Stream a file previously uploaded via POST/PUT /bills (e.g. a
        payment slip) by its storage key, such as bills/slips/<uuid>.jpeg
      parameters:
      - description: storage key, e.g. bills/slips/<uuid>.jpeg
        in: path
        name: path
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Get an uploaded file
      tags:
      - File Module (Version 1)
  /api/v1/stores:
    get:
      consumes:
      - application/json
      description: Get stores (paginated)
      parameters:
      - description: page number
        in: query
        name: page
        type: string
      - description: page size
        in: query
        name: limit
        type: string
      - description: search keyword
        in: query
        name: search
        type: string
      produces:
