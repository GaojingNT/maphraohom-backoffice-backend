definitions:
  dtos.ChangePasswordDto:
    properties:
      confirmPassword:
        type: string
      currentPassword:
        type: string
      newPassword:
        maxLength: 100
        minLength: 8
        type: string
    required:
    - confirmPassword
    - currentPassword
    - newPassword
    type: object
  dtos.CreateBill:
    properties:
      createdAt:
        description: |-
          CreatedAt lets the client back- or post-date a bill (e.g. entering one
          for a sale that actually happened earlier) — RFC3339, e.g.
          "2026-09-20T14:30:00+07:00". Optional; defaults to the time the
          request is processed when omitted. Only book/receipt numbering's
          calendar-year rollover uses the real server clock — this field never
          affects that.
        type: string
      customerAddress:
        type: string
      customerId:
        type: integer
      customerName:
        type: string
      customerPhone:
        type: string
      discount:
        type: number
      items:
        items:
          $ref: '#/definitions/dtos.CreateBillItem'
        type: array
      shippingFee:
        type: number
      storeId:
        type: integer
      type:
        type: string
    type: object
  dtos.CreateBillItem:
    properties:
      price:
        type: number
      productId:
        type: integer
      quantity:
        type: number
    type: object
  dtos.CreateCustomer:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  dtos.CreateCustomerAddress:
    properties:
      address:
        type: string
      isDefault:
        type: boolean
    required:
    - address
    type: object
  dtos.CreateCustomerPhone:
    properties:
      isDefault:
        type: boolean
      phone:
        type: string
    required:
    - phone
    type: object
  dtos.UpdateBill:
    properties:
      customerAddress:
        type: string
      customerId:
        type: integer
      customerName:
        type: string
      customerPhone:
        type: string
      discount:
        type: number
      items:
        items:
          $ref: '#/definitions/dtos.CreateBillItem'
        type: array
      shippingFee:
        type: number
      storeId:
        type: integer
      type:
        type: string
    type: object
  dtos.UpdateProfileDto:
    properties:
      email:
        maxLength: 100
        type: string
      firstName:
        maxLength: 100
        type: string
      lastName:
        maxLength: 100
        type: string
    required:
    - email
    type: object
  dtos.UpdateStore:
    properties:
      address:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  exception.ErrorResponse:
    properties:
      code:
        type: string
      errors:
        items:
          $ref: '#/definitions/exception.ParameterError'
        type: array
      message:
        type: string
    type: object
  exception.ParameterError:
    properties:
      field:
        type: string
      tag:
        type: string
      value:
        type: string
    type: object
  http_response.OkResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  paginator.Pagination:
    properties:
      attributes:
        additionalProperties: true
        type: object
      data: {}
      limit:
        type: integer
      orderBy:
        type: string
      page:
        type: integer
      sort:
        type: string
      totalPages:
        type: integer
      totalRows:
        type: integer
    type: object
  responses.BillCreatorResponse:
    properties:
      firstName:
        type: string
      id:
        type: integer
      lastName:
        type: string
    type: object
  responses.BillDetailResponse:
    properties:
      bookNo:
        type: integer
      createdAt:
        type: string
      createdBy:
        allOf:
        - $ref: '#/definitions/responses.BillCreatorResponse'
        description: |-
          Audit fields — each is JSON null (never omitted, never a zero
          time) when unknown: createdBy for bills from before it was
          recorded, editedAt when never edited via PUT /bills/:id,
          slipUploadedAt when there's no slip.
      customerAddress:
        type: string
      customerId:
        type: integer
      customerName:
        type: string
      customerPhone:
        type: string
      discount:
        type: number
      editedAt:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/responses.BillItemDetail'
        type: array
      receiptNo:
        type: integer
      shippingFee:
        type: number
      slipUploadedAt:
        type: string
      slipUrl:
        type: string
      storeAddress:
        type: string
      storeId:
        type: integer
      storeLogo:
        type: string
      storeName:
        type: string
      storePhone:
        type: string
      total:
        type: number
      type:
        type: string
      updatedAt:
        type: string
    type: object
  responses.BillItemDetail:
    properties:
      id:
        type: integer
      price:
        type: number
      productId:
        type: integer
      productName:
        type: string
      quantity:
        type: number
      subtotal:
        type: number
      unit:
        type: string
    type: object
  responses.CustomerAddressItem:
    properties:
      address:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      isDefault:
        type: boolean
      updatedAt:
        type: string
    type: object
  responses.CustomerDetailResponse:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
      updatedAt:
        type: string
    type: object
  responses.CustomerPhoneItem:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      isDefault:
        type: boolean
      phone:
        type: string
      updatedAt:
        type: string
    type: object
  responses.GetProfileResponse:
    properties:
      createdAt:
        description: Timestamp & Audit fields
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: integer
      lastName:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/responses.GetProfileRoleResponse'
        description: Relations
      signature:
        description: |-
          Ready-to-use URL of the user's signature image — printed on every
          receipt they export. Empty string when unset.
        type: string
      stores:
        items:
          $ref: '#/definitions/responses.GetProfileStoreResponse'
        type: array
      updatedAt:
        type: string
    type: object
  responses.GetProfileRoleGroupRoleResponse:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  responses.GetProfileRoleMenuResponse:
    properties:
      description:
        type: string
      icon:
        type: string
      id:
        type: integer
      isActive:
        type: boolean
      isFeature:
        type: boolean
      keyName:
        type: string
      label:
        type: string
      mode:
        type: string
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/responses.GetProfileRolePermissionResponse'
        type: array
      subMenus:
        description: Relations
        items:
          $ref: '#/definitions/responses.GetProfileRoleMenuResponse'
        type: array
      urlPath:
        type: string
    type: object
  responses.GetProfileRolePermissionResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  responses.GetProfileRoleResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      label:
        type: string
      menus:
        items:
          $ref: '#/definitions/responses.GetProfileRoleMenuResponse'
        type: array
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/responses.GetProfileRolePermissionResponse'
        type: array
      roleGroup:
        allOf:
        - $ref: '#/definitions/responses.GetProfileRoleGroupRoleResponse'
        description: Relations
    type: object
  responses.GetProfileStoreResponse:
    properties:
      id:
        type: integer
      logo:
        type: string
      name:
        type: string
    type: object
  responses.GetUserByIDResponse:
    properties:
      code:
        type: string
      message:
        type: string
      user:
        $ref: '#/definitions/responses.UserResponse'
    type: object
  responses.LastPriceItem:
    properties:
      price:
        type: number
      productId:
        type: integer
    type: object
  responses.ProductListItem:
    properties:
      id:
        type: integer
      name:
        type: string
      unit:
        type: string
    type: object
  responses.StoreDetailResponse:
    properties:
      address:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      logo:
        type: string
      name:
        type: string
      owners:
        items:
          $ref: '#/definitions/responses.StoreOwnerResponse'
        type: array
      phone:
        type: string
      updatedAt:
        type: string
    type: object
  responses.StoreOwnerResponse:
    properties:
      email:
        type: string
      firstName:
        type: string
      id:
        type: integer
      lastName:
        type: string
    type: object
  responses.UserResponse:
    properties:
      createdAt:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: integer
      lastName:
        type: string
      permissions:
        items:
          type: string
        type: array
      roleId:
        description: Role
        type: integer
      roleName:
        type: string
      updatedAt:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/auth/encrypt-password:
    post:
      consumes:
      - application/json
      description: Encrypt password
      parameters:
      - description: password
        in: body
        name: password
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http_response.OkResponse'
      summary: Encrypt password
      tags:
      - Auth Module (Version 1)
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Request to forgot password
      parameters:
      - description: email
        in: body
        name: email
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http_response.OkResponse'
      summary: Forgot password
      tags:
      - Auth Module (Version 1)
  /api/v1/auth/profile:
    get:
      consumes:
      - application/json
      description: Get profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http_response.OkResponse'
      summary: Get profile
      tags:
      - Auth Module (Version 1)
    put:
      consumes:
      - application/json
      description: Replace the signed-in user's first name, last name and email. The
        signature is uploaded through its own endpoint.
      parameters:
      - description: profile
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateProfileDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Update profile
      tags:
      - Auth Module (Version 1)
  /api/v1/auth/profile/password:
    put:
      consumes:
      - application/json
      description: Replace the signed-in user's password. The current password must
        be given and correct; newPassword must be 8+ characters and match confirmPassword.
      parameters:
      - description: passwords
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.ChangePasswordDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Change my password
      tags:
      - Auth Module (Version 1)
  /api/v1/auth/profile/signature:
    delete:
      consumes:
      - application/json
      description: Clear the signed-in user's signature and remove the underlying
        file (best-effort)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Delete my signature
      tags:
      - Auth Module (Version 1)
    put:
      consumes:
      - multipart/form-data
      description: Upload a signature image (jpeg/png/webp, checked by magic bytes,
        ≤ 10MB) for the signed-in user. Replaces any existing signature. Printed on
        every receipt this user exports.
      parameters:
      - description: signature image
        in: formData
        name: signature
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              signature:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Upload my signature
      tags:
      - Auth Module (Version 1)
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Request to reset password
      parameters:
      - description: email
        in: body
        name: email
        required: true
        schema:
          type: string
      - description: resetPasswordToken
        in: body
        name: resetPasswordToken
        required: true
        schema:
          type: string
      - description: password
        in: body
        name: password
        required: true
        schema:
          type: string
      - description: confirmPassword
        in: body
        name: confirmPassword
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http_response.OkResponse'
      summary: reset password
      tags:
      - Auth Module (Version 1)
  /api/v1/auth/signin:
    post:
      consumes:
      - application/json
      description: Sign in
      parameters:
      - description: username
        in: body
        name: username
        required: true
        schema:
          type: string
      - description: password
        in: body
        name: password
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http_response.OkResponse'
      summary: Sign in
      tags:
      - Auth Module (Version 1)
  /api/v1/bills:
    get:
      consumes:
      - application/json
      description: |-
        Get bills (paginated) — id, type, storeId, storeName, bookNo,
        receiptNo, customerName, customerAddress, total, itemCount, hasSlip, createdAt
      parameters:
      - description: page number
        in: query
        name: page
        type: string
      - description: page size
        in: query
        name: limit
        type: string
      - description: search keyword
        in: query
        name: search
        type: string
      - description: 'filter by bill type: receipt or payment'
        in: query
        name: type
        type: string
      - description: filter by store id
        in: query
        name: storeId
        type: integer
      - description: filter created_at >= this date, YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: filter created_at <= this date, YYYY-MM-DD
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/paginator.Pagination'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: List bills
      tags:
      - Bill Module (Version 1)
    post:
      consumes:
      - application/json
      description: |-
        Create a bill (JSON) with one or more line items, priced by the
        caller (no price list). Book/receipt numbers are computed
        server-side, scoped per (store, type); unit/subtotal/total and
        anything else derivable are ignored if the client sends them.
        createdAt is optional (RFC3339) to back-/post-date the bill —
        defaults to now when omitted; never affects book/receipt numbering.
      parameters:
      - description: bill
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateBill'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/responses.BillDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Create bill
      tags:
      - Bill Module (Version 1)
  /api/v1/bills/{id}:
    delete:
      consumes:
      - application/json
      description: Delete bill by id — soft delete only, slip and book/receipt number
        are kept as-is (never reused)
      parameters:
      - description: bill id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Delete bill
      tags:
      - Bill Module (Version 1)
    get:
      consumes:
      - application/json
      description: Get bill by id — every bills column except deleted_at, plus a ready-to-use
        slipUrl
      parameters:
      - description: bill id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BillDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Get bill
      tags:
      - Bill Module (Version 1)
    put:
      consumes:
      - application/json
      description: |-
        Replace a bill's customer, items, discount, and shipping fee
        (JSON, same shape as create). storeId and type must match the
        existing bill — sending different values is rejected with 400.
        Book/receipt numbers and the slip are never touched here.
      parameters:
      - description: bill id
        in: path
        name: id
        required: true
        type: integer
      - description: bill
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateBill'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BillDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Update bill
      tags:
      - Bill Module (Version 1)
  /api/v1/bills/{id}/slip:
    delete:
      consumes:
      - application/json
      description: Clear a bill's slip and remove the underlying file (best-effort)
      parameters:
      - description: bill id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Delete a bill's slip
      tags:
      - Bill Module (Version 1)
    put:
      consumes:
      - multipart/form-data
      description: Upload a slip image (jpeg/png/webp, checked by magic bytes, ≤ 10MB)
        for an existing, non-deleted bill. Replaces any existing slip.
      parameters:
      - description: bill id
        in: path
        name: id
        required: true
        type: integer
      - description: slip image
        in: formData
        name: slip
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              slipUrl:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Upload a bill's slip
      tags:
      - Bill Module (Version 1)
  /api/v1/customers:
    get:
      consumes:
      - application/json
      description: Get customers (paginated)
      parameters:
      - description: page number
        in: query
        name: page
        type: string
      - description: page size
        in: query
        name: limit
        type: string
      - description: search keyword
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/paginator.Pagination'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: List customers
      tags:
      - Customer Module (Version 1)
    post:
      consumes:
      - application/json
      description: Create a new customer by name
      parameters:
      - description: customer
        in: body
