  /api/v1/customers/{id}:
    get:
      consumes:
      - application/json
      description: Get customer by id
      parameters:
      - description: customer id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.CustomerDetailResponse'
        "404":
