        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http_response.OkResponse'
      summary: Get profile
      tags:
      - Auth Module (Version 1)
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Request to reset password
      parameters:
      - description: email
        in: body
        name: email
        required: true
        schema:
          type: string
      - description: resetPasswordToken
        in: body
        name: resetPasswordToken
        required: true
        schema:
          type: string
      - description: password
        in: body
        name: password
        required: true
        schema:
          type: string
      - description: confirmPassword
        in: body
        name: confirmPassword
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http_response.OkResponse'
      summary: reset password
      tags:
      - Auth Module (Version 1)
  /api/v1/auth/signin:
    post:
      consumes:
      - application/json
      description: Sign in
      parameters:
      - description: username
        in: body
        name: username
        required: true
        schema:
          type: string
      - description: password
        in: body
        name: password
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http_response.OkResponse'
      summary: Sign in
      tags:
      - Auth Module (Version 1)
  /api/v1/bills:
    get:
      consumes:
      - application/json
      description: |-
        Get bills (paginated) — id, storeId, storeName, receiptNo,
        customerName, customerAddress, total, totalKilogram, itemCount, createdAt
      parameters:
      - description: page number
        in: query
        name: page
        type: string
      - description: page size
        in: query
        name: limit
        type: string
      - description: search keyword
        in: query
        name: search
        type: string
      - description: 'filter by created_at: day, week, month, or year'
        in: query
        name: period
        type: string
      - description: 'reference date for period, YYYY-MM-DD (default: today)'
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/paginator.Pagination'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: List bills
      tags:
      - Bill Module (Version 1)
    post:
      consumes:
      - multipart/form-data
      description: |-
        Create a bill with one or more line items. Book/receipt
        numbers and each item's price are computed server-side (price
        looked up from the store's current product price); the receipt
        number resets every 50 receipts (new book) and every calendar
        year (back to book 1 / receipt 1).
      parameters:
      - description: store id
        in: formData
        name: storeId
        required: true
        type: integer
      - description: customer name
        in: formData
        name: customerName
        required: true
        type: string
      - description: customer address
        in: formData
        name: customerAddress
        required: true
        type: string
      - description: JSON array, e.g. [{\
        in: formData
        name: items
        required: true
        type: string
      - description: discount
        in: formData
        name: discount
        type: number
      - description: shipping fee
        in: formData
        name: shippingFee
        type: number
      - description: slip image
        in: formData
        name: slip
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BillDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Create bill
      tags:
      - Bill Module (Version 1)
  /api/v1/bills/{id}:
    delete:
      consumes:
      - application/json
      description: Delete bill by id
      parameters:
      - description: bill id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Delete bill
      tags:
      - Bill Module (Version 1)
    get:
      consumes:
      - application/json
      description: Get bill by id — every bills column except deleted_at
      parameters:
      - description: bill id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BillDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Get bill
      tags:
      - Bill Module (Version 1)
    put:
      consumes:
      - multipart/form-data
      description: |-
        Replace a bill's store, customer, items, discount, shipping
        fee, and (optionally) slip. Book/receipt numbers are kept as-is;
        each item's price is re-looked-up from the store's current
        product price, same as create.
      parameters:
      - description: bill id
        in: path
        name: id
        required: true
        type: integer
      - description: store id
        in: formData
        name: storeId
        required: true
        type: integer
      - description: customer name
        in: formData
        name: customerName
        required: true
        type: string
      - description: customer address
        in: formData
        name: customerAddress
        required: true
        type: string
      - description: JSON array, e.g. [{\
        in: formData
        name: items
        required: true
        type: string
      - description: discount
        in: formData
        name: discount
        type: number
      - description: shipping fee
        in: formData
        name: shippingFee
        type: number
      - description: new slip image (replaces the existing one)
        in: formData
        name: slip
        type: file
      - description: clear the existing slip (ignored if a new slip is uploaded)
        in: formData
        name: removeSlip
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BillDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Update bill
      tags:
      - Bill Module (Version 1)
  /api/v1/customers:
    get:
      consumes:
      - application/json
      description: Get customers (paginated)
      parameters:
