definitions:
  exception.ErrorResponse:
    properties:
      code:
        type: string
      errors:
        items:
          $ref: '#/definitions/exception.ParameterError'
        type: array
      message:
        type: string
    type: object
  exception.ParameterError:
    properties:
      field:
        type: string
      tag:
        type: string
      value:
        type: string
    type: object
  http_response.OkResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  paginator.Pagination:
    properties:
      attributes:
        additionalProperties: true
        type: object
      data: {}
      limit:
        type: integer
      orderBy:
        type: string
      page:
        type: integer
      sort:
        type: string
      totalPages:
        type: integer
      totalRows:
        type: integer
    type: object
  responses.BillDetailResponse:
    properties:
      bookNo:
        type: integer
      createdAt:
        type: string
      customerAddress:
        type: string
      customerId:
        type: integer
      customerName:
        type: string
      discount:
        type: number
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/responses.BillItemDetail'
        type: array
      receiptNo:
        type: integer
      shippingFee:
        type: number
      slip:
        type: string
      storeId:
        type: integer
      storeLogo:
        type: string
      storeName:
        type: string
      total:
        type: number
      updatedAt:
        type: string
    type: object
  responses.BillItemDetail:
    properties:
      id:
        type: integer
      kilogram:
        type: number
      price:
        type: number
      productId:
        type: integer
      productName:
        type: string
      subtotal:
        type: number
    type: object
  responses.CustomerAddressItem:
    properties:
      address:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      isDefault:
        type: boolean
      label:
        type: string
      updatedAt:
        type: string
    type: object
  responses.CustomerDetailResponse:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
      updatedAt:
        type: string
    type: object
  responses.GetProfileResponse:
    properties:
      createdAt:
        description: Timestamp & Audit fields
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: integer
      lastName:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/responses.GetProfileRoleResponse'
        description: Relations
      updatedAt:
        type: string
    type: object
  responses.GetProfileRoleGroupRoleResponse:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  responses.GetProfileRoleMenuResponse:
    properties:
      description:
        type: string
      icon:
        type: string
      id:
        type: integer
      isActive:
        type: boolean
      isFeature:
        type: boolean
      keyName:
        type: string
      label:
        type: string
      mode:
        type: string
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/responses.GetProfileRolePermissionResponse'
        type: array
      subMenus:
        description: Relations
        items:
          $ref: '#/definitions/responses.GetProfileRoleMenuResponse'
        type: array
      urlPath:
        type: string
    type: object
  responses.GetProfileRolePermissionResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  responses.GetProfileRoleResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      label:
        type: string
      menus:
        items:
          $ref: '#/definitions/responses.GetProfileRoleMenuResponse'
        type: array
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/responses.GetProfileRolePermissionResponse'
        type: array
      roleGroup:
        allOf:
        - $ref: '#/definitions/responses.GetProfileRoleGroupRoleResponse'
        description: Relations
    type: object
  responses.GetUserByIDResponse:
    properties:
      code:
        type: string
      message:
        type: string
      user:
        $ref: '#/definitions/responses.UserResponse'
    type: object
  responses.StoreDetailResponse:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      logo:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
  responses.StoreProductPriceItem:
    properties:
      effectiveFrom:
        type: string
      price:
        type: number
      productId:
        type: integer
      productName:
        type: string
    type: object
  responses.UserResponse:
    properties:
      createdAt:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: integer
      lastName:
        type: string
      permissions:
        items:
          type: string
        type: array
      roleId:
        description: Role
        type: integer
      roleName:
        type: string
      updatedAt:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/auth/encrypt-password:
    post:
      consumes:
      - application/json
      description: Encrypt password
      parameters:
      - description: password
        in: body
        name: password
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http_response.OkResponse'
      summary: Encrypt password
      tags:
      - Auth Module (Version 1)
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Request to forgot password
      parameters:
      - description: email
        in: body
        name: email
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http_response.OkResponse'
        "500":
          description: Internal Server Error
