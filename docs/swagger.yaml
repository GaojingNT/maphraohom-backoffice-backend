      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/paginator.Pagination'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: List stores
      tags:
