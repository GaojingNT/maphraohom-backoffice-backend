        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: Get a store's price for one product
      tags:
      - Store Module (Version 1)
  /api/v1/users:
    get:
      consumes:
      - application/json
      description: get users
      parameters:
      - description: page number
        in: query
        name: page
